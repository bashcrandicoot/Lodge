<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="365" viewBox="0 0 1070 365" font-family="-apple-system, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#8E8E93"/></marker></defs>
<rect width="1070" height="365" rx="12" fill="#1E1E1E" stroke="#3A3A3C"/>
<circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/>
<text x="535.0" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#EBEBF5" fill-opacity="0.85">How Lodge verifies each file</text>
<line x1="0" y1="40" x2="1070" y2="40" stroke="#3A3A3C"/><rect x="30" y="70" width="230" height="100" rx="10" fill="#2C2C2E" fill-opacity="1" stroke="#3A3A3C" stroke-width="1.5"/><text x="145.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">1. Copy + hash</text><text x="145.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Writes &lt;name&gt;.lodge-partial</text><text x="145.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">SHA-256 of the source</text><text x="145.0" y="162" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">as it reads</text><line x1="260" y1="120" x2="310" y2="120" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><rect x="310" y="70" width="230" height="100" rx="10" fill="#2C2C2E" fill-opacity="1" stroke="#3A3A3C" stroke-width="1.5"/><text x="425.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">2. Read back</text><text x="425.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Reads the partial file</text><text x="425.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">from disk and hashes it</text><line x1="540" y1="120" x2="590" y2="120" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><rect x="590" y="70" width="170" height="100" rx="10" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF" stroke-width="1.5"/><text x="675.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">3. Compare</text><text x="675.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Do the hashes</text><text x="675.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">match?</text><line x1="760" y1="100" x2="810" y2="100" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><text x="785.0" y="92.0" font-size="11.5" fill="#EBEBF5" fill-opacity="0.6" text-anchor="middle">Match</text><rect x="810" y="60" width="230" height="80" rx="10" fill="#30D158" fill-opacity="0.16" stroke="#30D158" stroke-width="1.5"/><text x="925.0" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Renamed to final name</text><text x="925.0" y="114" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">File kept</text><line x1="675" y1="170" x2="675" y2="215" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><text x="681.0" y="184.5" font-size="11.5" fill="#EBEBF5" fill-opacity="0.6" text-anchor="start">No match</text><rect x="560" y="215" width="230" height="80" rx="10" fill="#FF9F0A" fill-opacity="0.16" stroke="#FF9F0A" stroke-width="1.5"/><text x="675.0" y="245" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Partial file deleted</text><text x="675.0" y="269" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Checksum mismatch</text><text x="535" y="340" text-anchor="middle" font-size="12" fill="#EBEBF5" fill-opacity="0.5">The card is only read. An existing file at the final path is never overwritten.</text></svg>