<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="310" viewBox="0 0 1050 310" font-family="-apple-system, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#8E8E93"/></marker></defs>
<rect width="1050" height="310" rx="12" fill="#1E1E1E" stroke="#3A3A3C"/>
<circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/>
<text x="525.0" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#EBEBF5" fill-opacity="0.85">Eject after offload</text>
<line x1="0" y1="40" x2="1050" y2="40" stroke="#3A3A3C"/><rect x="30" y="70" width="220" height="90" rx="10" fill="#2C2C2E" fill-opacity="1" stroke="#3A3A3C" stroke-width="1.5"/><text x="140.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Offload finishes</text><text x="140.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Eject card after offload</text><text x="140.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">is on (default: off)</text><line x1="250" y1="115" x2="300" y2="115" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="70" width="200" height="90" rx="10" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF" stroke-width="1.5"/><text x="400.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Every file verified?</text><text x="400.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6"></text><line x1="500" y1="115" x2="550" y2="115" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><text x="525.0" y="107.0" font-size="11.5" fill="#EBEBF5" fill-opacity="0.6" text-anchor="middle">Yes</text><rect x="550" y="70" width="230" height="90" rx="10" fill="#30D158" fill-opacity="0.16" stroke="#30D158" stroke-width="1.5"/><text x="665.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Unmount + eject</text><text x="665.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">“— card ejected,</text><text x="665.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">safe to remove”</text><line x1="400" y1="160" x2="400" y2="210" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><text x="406.0" y="177.0" font-size="11.5" fill="#EBEBF5" fill-opacity="0.6" text-anchor="start">No</text><rect x="290" y="210" width="220" height="70" rx="10" fill="#2C2C2E" fill-opacity="1" stroke="#3A3A3C" stroke-width="1.5"/><text x="400.0" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Card stays mounted</text><text x="400.0" y="264" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Use Eject Card</text><line x1="780" y1="115" x2="820" y2="115" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><text x="800.0" y="107.0" font-size="11.5" fill="#EBEBF5" fill-opacity="0.6" text-anchor="middle">fails</text><rect x="820" y="70" width="200" height="90" rx="10" fill="#FF9F0A" fill-opacity="0.16" stroke="#FF9F0A" stroke-width="1.5"/><text x="920.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Couldn’t eject</text><text x="920.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">&lt;card name&gt;:</text><text x="920.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">&lt;system message&gt;</text></svg>