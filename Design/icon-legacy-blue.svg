<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AB8FF"/>
      <stop offset="0.55" stop-color="#1E7BFF"/>
      <stop offset="1" stop-color="#0B4FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEFF"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="450" x2="0" y2="690">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="1" stop-color="#0A57F0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#iconshadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
    <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
  <!-- SD card: rounded body with clipped top-right corner -->
  <g filter="url(#shadow)" transform="translate(17,0)">
    <path d="M 372 262 L 566 262 L 652 348 L 652 728 Q 652 762 618 762 L 372 762 Q 338 762 338 728 L 338 296 Q 338 262 372 262 Z"
          fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- contacts -->
  <g fill="#1E7BFF" fill-opacity="0.22" transform="translate(17,0)">
    <rect x="384" y="300" width="34" height="88" rx="10"/>
    <rect x="432" y="300" width="34" height="88" rx="10"/>
    <rect x="480" y="300" width="34" height="88" rx="10"/>
    <rect x="528" y="300" width="34" height="88" rx="10"/>
  </g>
  <!-- arrow down into tray -->
  <g transform="translate(17,0)" fill="none" stroke="url(#arrow)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 495 452 L 495 610"/>
    <path d="M 432 552 L 495 615 L 558 552"/>
    <path d="M 410 670 L 580 670" stroke-width="30"/>
  </g>
</svg>
