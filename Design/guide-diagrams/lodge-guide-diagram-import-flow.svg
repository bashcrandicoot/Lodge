<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="345" viewBox="0 0 1040 345" font-family="-apple-system, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#8E8E93"/></marker></defs>
<rect width="1040" height="345" rx="12" fill="#1E1E1E" stroke="#3A3A3C"/>
<circle cx="22" cy="20" r="6" fill="#FF5F57"/><circle cx="42" cy="20" r="6" fill="#FEBC2E"/><circle cx="62" cy="20" r="6" fill="#28C840"/>
<text x="520.0" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#EBEBF5" fill-opacity="0.85">Import a card</text>
<line x1="0" y1="40" x2="1040" y2="40" stroke="#3A3A3C"/><rect x="30" y="70" width="200" height="90" rx="10" fill="#2C2C2E" fill-opacity="1" stroke="#3A3A3C" stroke-width="1.5"/><text x="130.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Card plugged in</text><text x="130.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Lodge checks it’s</text><text x="130.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">camera media</text><line x1="230" y1="115" x2="280" y2="115" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><rect x="280" y="70" width="220" height="90" rx="10" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF" stroke-width="1.5"/><text x="390.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Import with Lodge?</text><text x="390.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Notification (default)</text><text x="390.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">or Floating panel</text><line x1="500" y1="115" x2="550" y2="115" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><text x="525.0" y="107.0" font-size="11.5" fill="#EBEBF5" fill-opacity="0.6" text-anchor="middle">Import</text><rect x="550" y="70" width="210" height="90" rx="10" fill="#2C2C2E" fill-opacity="1" stroke="#3A3A3C" stroke-width="1.5"/><text x="655.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Lodge opens</text><text x="655.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">with that card selected</text><text x="655.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Nothing copied yet</text><line x1="760" y1="115" x2="810" y2="115" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><rect x="810" y="70" width="200" height="90" rx="10" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF" stroke-width="1.5"/><text x="910.0" y="100" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Offload</text><text x="910.0" y="124" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Copy, then verify</text><text x="910.0" y="143" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">with SHA-256</text><line x1="390" y1="160" x2="390" y2="215" stroke="#8E8E93" stroke-width="1.5" marker-end="url(#a)"/><text x="396.0" y="179.5" font-size="11.5" fill="#EBEBF5" fill-opacity="0.6" text-anchor="start">Ignore / Don’t Ask for This Card</text><rect x="280" y="215" width="220" height="70" rx="10" fill="#2C2C2E" fill-opacity="1" stroke="#3A3A3C" stroke-width="1.5"/><text x="390.0" y="245" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Nothing happens</text><text x="390.0" y="269" text-anchor="middle" font-size="12.5" fill="#EBEBF5" fill-opacity="0.6">Card stays as is</text><text x="520" y="320" text-anchor="middle" font-size="12" fill="#EBEBF5" fill-opacity="0.5">Plugging in a card never starts a copy. Only Offload copies files.</text></svg>